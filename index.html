<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF7A59">
<title>Readaloo — Parent & Child Learning App Prototype</title>
<meta name="description" content="Interactive concept prototype: a daily, content-driven literacy routine for parents and young children.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--coral:#FF7A59;--coral-d:#E85E3D;--sun:#FFB020;--sun-d:#E09400;--teal:#22B5A4;--teal-d:#13978A;--lav:#8B7CF6;--lav-d:#6E5CE6;--sky:#4DA3FF;--sky-d:#2F86E6;--green:#36B868;--green-d:#259A53;--red:#F2545B;--gold:#FFC23C;--sat:50px;--sab:26px;--fd:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;--fb:'Nunito',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
html[data-theme=light]{color-scheme:light;--page:#F6ECDF;--bg:#FFF8EF;--surface:#FFFFFF;--surface-2:#FFF1E2;--surface-3:#F3E3CF;--text:#26293F;--muted:#7C8098;--line:#F0E2D0;--shadow:0 6px 22px rgba(90,55,20,.08),0 1px 3px rgba(90,55,20,.06);--ink:#26293F;--on-ink:#FFFFFF;--shade:#E9D8C3}
html[data-theme=dark]{color-scheme:dark;--page:#0D1122;--bg:#151A2E;--surface:#1E2541;--surface-2:#272F50;--surface-3:#333C62;--text:#F6F1E7;--muted:#A6ABC4;--line:#2C3458;--shadow:0 6px 22px rgba(0,0,0,.35);--ink:#F6F1E7;--on-ink:#151A2E;--shade:#11152A}
html,body{height:100%}
body{font-family:var(--fb);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
svg.i{flex:none;display:block}
.fd{font-family:var(--fd)}

/* ---------- page / pitch ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:64px;padding:20px 24px;background:radial-gradient(800px 520px at 10% 6%,rgba(255,122,89,.20),transparent 60%),radial-gradient(700px 520px at 92% 92%,rgba(139,124,246,.16),transparent 60%),radial-gradient(500px 400px at 85% 10%,rgba(255,176,32,.14),transparent 60%)}
.pitch{width:370px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font:700 21px var(--fd);margin-bottom:22px}
.brand em{font:800 10.5px var(--fb);font-style:normal;text-transform:uppercase;letter-spacing:.09em;background:var(--text);color:var(--bg);padding:4px 8px;border-radius:7px}
.pitch h1{font:600 36px/1.06 var(--fd);letter-spacing:-.01em;margin-bottom:14px}
.pitch p{color:var(--muted);font-size:15.5px;line-height:1.55;margin-bottom:20px;font-weight:600}
.feats{list-style:none;display:grid;gap:10px;margin-bottom:24px}
.feats li{display:flex;gap:11px;align-items:center;font-weight:700;font-size:14.5px}
.feats li span{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.jump-title{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}
.jump{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.jump button{height:34px;padding:0 12px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:13px;transition:background .2s,color .2s}
.jump button:hover{border-color:var(--text)}
.jump button.on{background:var(--text);color:var(--bg);border-color:transparent}
.pitch-foot{display:flex;gap:8px;flex-wrap:wrap}
.pitch-foot button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:13.5px}
.pitch-foot button:hover{border-color:var(--text)}
.pitch-foot .dbtn{background:var(--text);color:var(--bg);border-color:transparent}
.hint-small{margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.5;font-weight:600}

/* ---------- phone ---------- */
.phone-wrap{width:calc(390px * var(--s,1));height:calc(844px * var(--s,1));flex:none;position:relative}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--s,1));transform-origin:0 0;border-radius:60px;background:#17182A;padding:11px;box-shadow:0 0 0 2px #2E3046,0 50px 90px -30px rgba(60,30,10,.45),0 20px 40px -20px rgba(60,30,10,.3)}
.phone-inner{position:relative;width:100%;height:100%;border-radius:49px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:100}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:5px 28px 0 40px;font-weight:800;font-size:15px;z-index:99;pointer-events:none;color:var(--text);transition:color .3s}
.statusbar.light{color:#fff}
.sb-icons{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:var(--text);opacity:.8;z-index:100;pointer-events:none}
.home-ind.light{background:#fff}
@media (max-width:1000px){.stage{flex-direction:column;gap:28px;padding:32px 20px}.pitch{width:min(560px,100%)}.pitch h1{font-size:30px}}
@media (max-width:520px){
  .stage{padding:0;gap:0;display:block;background:var(--bg)}
  .pitch{display:none}
  .phone-wrap{width:100vw;height:100vh;height:100dvh}
  .phone{width:100%;height:100%;transform:none;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .phone-inner{border-radius:0}
  .island,.statusbar,.home-ind{display:none}
  :root{--sat:max(env(safe-area-inset-top),14px);--sab:max(env(safe-area-inset-bottom),12px)}
  input{font-size:16px!important}
}

/* ---------- layers ---------- */
#app{position:absolute;inset:0}
#screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.in-fwd{animation:inF .38s cubic-bezier(.2,.8,.2,1)}
.in-back{animation:inB .38s cubic-bezier(.2,.8,.2,1)}
.in-fade{animation:inFade .35s ease}
.in-up{animation:inUp .45s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes inB{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-10px) scale(1.08)}60%{transform:translateY(2px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- primitives ---------- */
.btn{height:56px;border-radius:20px;font:600 17.5px var(--fd);letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex:none;text-align:center;box-shadow:0 4px 0 var(--sh,var(--shade));transition:transform .1s,box-shadow .1s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh,var(--shade))}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-primary{background:var(--coral);color:#fff;--sh:var(--coral-d)}
.btn-green{background:var(--green);color:#fff;--sh:var(--green-d)}
.btn-dark{background:var(--ink);color:var(--on-ink);--sh:#0006}
.btn-ghost{background:var(--surface);color:var(--text);--sh:var(--shade);border:2px solid var(--line)}
.btn.sm{height:44px;border-radius:15px;font-size:15.5px}
.btn-link{font-weight:800;color:var(--muted);font-size:14.5px;padding:12px;width:100%;text-align:center}
.ibtn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--text);flex:none;position:relative}
.ibtn .nb{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.chip{height:38px;padding:0 14px;border-radius:13px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 20px 4px;margin:0 -20px}
.chips::-webkit-scrollbar,.scroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.msheet::-webkit-scrollbar{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 20px 28px}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 8px) 16px 12px;flex:none}
.topbar h2{flex:1;font:600 20px var(--fd)}
.tb-big{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--sat) + 12px) 20px 12px;flex:none}
.tb-big h1{font:600 30px var(--fd);letter-spacing:-.01em}
.sec{display:flex;align-items:baseline;justify-content:space-between;font:600 19px var(--fd);margin:24px 2px 12px}
.sec small{font:800 13px var(--fb);color:var(--muted)}
.card{background:var(--surface);border-radius:24px;padding:16px;border:2px solid var(--line)}
.muted{color:var(--muted)}
.switch{width:52px;height:31px;border-radius:20px;background:var(--surface-3);position:relative;transition:background .25s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .25s cubic-bezier(.3,.7,.2,1)}
.switch.on{background:var(--green)}
.switch.on::after{left:24px}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:7px}
.field input{width:100%;height:56px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:0 18px;font-size:17px;font-weight:700;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--coral)}
.seg{display:flex;background:var(--surface-2);border-radius:15px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:11px;font-weight:800;color:var(--muted);font-size:13.5px;text-align:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kav{border-radius:50%;flex:none;display:block}

/* ---------- tabbar ---------- */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:2px solid var(--line);padding:8px 6px calc(var(--sab) + 2px);flex:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--muted);padding:2px 0;text-align:center}
.tabbar .ti{width:54px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s,color .25s}
.tabbar .on{color:var(--text)}
.tabbar .on .ti{background:var(--coral);color:#fff}

/* ---------- splash & onboarding ---------- */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--coral);color:#fff;gap:14px;position:relative;overflow:hidden}
.splash .lg{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.splash .wm{font:600 40px var(--fd);animation:inUp .7s .15s both}
.splash .tg{font-weight:800;opacity:.9;animation:inUp .7s .3s both}
.splash .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.welcome{flex:1;display:flex;flex-direction:column;padding:calc(var(--sat) + 10px) 24px calc(var(--sab) + 18px);min-height:0}
.welcome .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.welcome .art svg{width:100%;max-width:320px;height:auto;max-height:100%}
.welcome h1{font:600 33px/1.08 var(--fd);margin-bottom:10px}
.welcome p{color:var(--muted);font-size:16.5px;line-height:1.5;font-weight:600;margin-bottom:22px}
.steps-top{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 8px) 16px 6px;flex:none}
.steps-top .pbar{flex:1;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.steps-top .pbar i{display:block;height:100%;background:var(--coral);border-radius:5px;transition:width .5s}
.setup h1{font:600 28px/1.1 var(--fd);margin:14px 0 6px}
.setup .lead{color:var(--muted);font-weight:600;margin-bottom:22px;font-size:15.5px;line-height:1.45}
.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.ages button{height:56px;border-radius:17px;background:var(--surface);border:2px solid var(--line);font:600 20px var(--fd);text-align:center}
.ages button.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--surface));color:var(--coral-d)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.avs button{border-radius:50%;border:3px solid transparent;padding:2px;transition:transform .15s;min-width:0;aspect-ratio:1}
.avs button svg{width:100%;height:100%}
.avs button.on{border-color:var(--coral);transform:scale(1.08)}
.goals{display:grid;gap:10px;margin-bottom:22px}
.goal-opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--surface);border:2px solid var(--line);width:100%}
.goal-opt.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 9%,var(--surface))}
.goal-opt .gm{width:58px;height:58px;border-radius:18px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 22px/1 var(--fd);flex:none}
.goal-opt .gm small{font:800 10.5px var(--fb);color:var(--muted);margin-top:2px}
.goal-opt b{display:block;font:600 17px var(--fd)}
.goal-opt span{font-size:13.5px;color:var(--muted);font-weight:600}
.goal-opt .tag{margin-left:auto;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--sun);color:#3A2600;text-transform:uppercase;letter-spacing:.05em;flex:none}
.build{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 34px;text-align:center}
.build h1{font:600 26px var(--fd);margin:18px 0 22px}
.build ul{list-style:none;display:grid;gap:12px;text-align:left;width:100%}
.build li{display:flex;gap:12px;align-items:center;font-weight:700;opacity:.3;transition:opacity .4s}
.build li.on{opacity:1}
.build li .ck{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;flex:none;color:#fff;transition:background .3s}
.build li.on .ck{background:var(--green)}
.spinner{width:64px;height:64px;border-radius:50%;border:6px solid var(--surface-3);border-top-color:var(--coral);animation:spin .9s linear infinite}

/* ---------- home ---------- */
.hhead{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 20px 6px;flex:none}
.kid{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.kid small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.kid b{display:flex;align-items:center;gap:4px;font:600 19px var(--fd);white-space:nowrap}
.streak-pill{display:flex;align-items:center;gap:5px;height:42px;padding:0 13px;border-radius:15px;background:color-mix(in srgb,var(--sun) 22%,var(--surface));border:2px solid color-mix(in srgb,var(--sun) 40%,var(--surface));font:600 18px var(--fd);color:#C26A00;flex:none}
html[data-theme=dark] .streak-pill{color:var(--sun)}
.streak-pill svg{color:#FF8A1F}
.goalcard{display:flex;align-items:center;gap:16px;margin-top:8px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 21px/1 var(--fd)}
.ring b small{font:800 10px var(--fb);color:var(--muted);margin-top:2px}
.goalcard .gt b{display:block;font:600 18px var(--fd)}
.goalcard .gt span{font-size:13.5px;color:var(--muted);font-weight:700}
.wkdots{display:flex;gap:4px;margin-top:9px}
.wkdots i{width:24px;height:24px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font:800 10.5px var(--fb);font-style:normal;color:var(--muted)}
.wkdots i.d{background:var(--sun);color:#3A2600}
.wkdots i.t{border:2px dashed var(--coral);color:var(--coral)}
.wkdots i.t.d{border:0;background:var(--coral);color:#fff}
.hero{border-radius:28px;padding:20px;color:#fff;position:relative;overflow:hidden;margin-top:16px;box-shadow:0 6px 0 var(--hd)}
.hero .hl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.hero h3{font:600 26px/1.1 var(--fd);margin:6px 0 4px;max-width:62%}
.hero .hm{font-weight:700;font-size:14px;opacity:.92}
.hero .hart{position:absolute;right:-8px;top:12px;width:132px;height:132px;display:grid;place-items:center;font-size:76px;animation:floaty 3.5s ease-in-out infinite}
.hero .hart svg{width:150px;height:auto;border-radius:20px}
.hero .btn{margin-top:16px;width:auto;padding:0 22px;height:50px;background:#fff;color:var(--text);--sh:rgba(0,0,0,.18);display:inline-flex}
.done-hero{background:var(--green);--hd:var(--green-d)}
.plan{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.prow{display:flex;align-items:center;gap:13px;padding:11px 14px 11px 11px;border-radius:22px;background:var(--surface);border:2px solid var(--line);width:100%;transition:transform .15s}
.prow:active{transform:scale(.985)}
.prow .tx{flex:1;min-width:0}
.prow .cl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.prow b{display:block;font:600 16.5px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{font-size:12.5px;color:var(--muted);font-weight:700}
.prow .st{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.prow.done .st{background:var(--green);border-color:var(--green);color:#fff}
.prow.done b{color:var(--muted)}
.thumb{border-radius:17px;display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.thumb svg{width:100%;height:100%}
.tipcard{display:flex;gap:13px;align-items:flex-start;padding:16px;border-radius:24px;background:color-mix(in srgb,var(--lav) 13%,var(--surface));border:2px solid color-mix(in srgb,var(--lav) 25%,var(--surface))}
.tipcard .ti2{width:42px;height:42px;border-radius:14px;background:var(--lav);color:#fff;display:grid;place-items:center;flex:none}
.tipcard b{font:600 16px var(--fd);display:block;margin-bottom:3px}
.tipcard p{font-size:14px;color:var(--muted);font-weight:600;line-height:1.45}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.mini{width:150px;flex:none;text-align:left}
.mini .thumb{width:150px;height:110px;border-radius:22px;font-size:54px;margin-bottom:8px}
.mini b{display:block;font:600 15px var(--fd);line-height:1.2}
.mini small{font-size:12px;color:var(--muted);font-weight:700}

/* ---------- intro ---------- */
.ihero{height:250px;border-radius:30px;display:grid;place-items:center;font-size:110px;position:relative;overflow:hidden;margin-bottom:18px}
.ihero svg.scene{width:100%;height:100%}
.ihero .em{animation:floaty 3.5s ease-in-out infinite}
.itags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.itag{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:12.5px}
.intro h1{font:600 30px/1.08 var(--fd)}
.intro .desc{font-size:16px;line-height:1.5;color:var(--muted);font-weight:600}
.forgu{margin-top:18px;padding:16px;border-radius:24px;background:var(--surface);border:2px solid var(--line)}
.forgu h4{display:flex;align-items:center;gap:8px;font:600 16.5px var(--fd);margin-bottom:10px}
.forgu li{list-style:none;display:flex;gap:10px;font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:8px}
.forgu li svg{color:var(--green);margin-top:2px}
.foot{padding:12px 20px calc(var(--sab) + 12px);flex:none;background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* ---------- lessons ---------- */
.lhead{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 8px) 16px 8px;flex:none}
.lbar{flex:1;height:14px;border-radius:7px;background:var(--surface-3);overflow:hidden}
.lbar i{display:block;height:100%;width:0;border-radius:7px;background:var(--green);transition:width .4s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.lbody{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 12px;display:flex;flex-direction:column;scrollbar-width:none}
.lbody::-webkit-scrollbar{display:none}
.lfoot{display:flex;align-items:center;gap:14px;padding:10px 20px calc(var(--sab) + 12px);flex:none}
.lfoot .btn{width:auto;flex:1}
.ldots{display:flex;gap:6px}
.ldots i{width:10px;height:10px;border-radius:5px;background:var(--surface-3);transition:width .3s,background .3s}
.ldots i.on{width:24px;background:var(--coral)}
.ldots i.d{background:var(--green)}
.ltitle{font:600 15px var(--fd);color:var(--muted);text-align:center;margin-bottom:10px}
.wcard{background:var(--surface);border:2px solid var(--line);border-radius:30px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:inUp .4s cubic-bezier(.2,.8,.2,1)}
.pic{width:130px;height:130px;border-radius:40px;display:grid;place-items:center;font-size:78px;cursor:pointer;transition:transform .15s}
.pic:active{transform:scale(.94)}
.tiles{display:flex;gap:10px;transition:gap .4s}
.tile{min-width:74px;height:86px;padding:0 10px;border-radius:22px;background:var(--surface);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font:600 50px/1 var(--fd);display:grid;place-items:center;transition:transform .12s,background .2s,border-color .2s,color .2s,border-radius .4s}
.tile.v{color:var(--coral)}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tile.pl{animation:bounce .45s;background:color-mix(in srgb,var(--sun) 25%,var(--surface));border-color:var(--sun)}
.tiles.merged{gap:0}
.tiles.merged .tile{border-radius:0;border-left-width:0;border-right-width:0}
.tiles.merged .tile:first-child{border-radius:22px 0 0 22px;border-left-width:3px}
.tiles.merged .tile:last-child{border-radius:0 22px 22px 0;border-right-width:3px}
.tiles.merged .tile{background:color-mix(in srgb,var(--green) 16%,var(--surface));border-color:var(--green)}
.cap{font:600 18px var(--fd);color:var(--muted);min-height:26px;text-align:center}
.cap b{color:var(--text);font-size:22px}
.wave{display:inline-flex;gap:3px;align-items:center;height:18px;vertical-align:middle;margin-left:6px}
.wave i{width:4px;border-radius:2px;background:var(--coral);animation:wv .7s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}
@keyframes wv{0%,100%{height:5px}50%{height:18px}}
.blend{width:auto;padding:0 22px;height:50px}
.ask{margin-top:14px;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:22px;background:color-mix(in srgb,var(--lav) 12%,var(--surface));border:2px dashed color-mix(in srgb,var(--lav) 45%,var(--surface))}
.ask .ai{width:36px;height:36px;border-radius:12px;background:var(--lav);color:#fff;display:grid;place-items:center;flex:none}
.ask small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--lav-d)}
html[data-theme=dark] .ask small{color:#B6ACFF}
.ask p{font-weight:700;font-size:15px;line-height:1.4}
.sight-word{font:600 76px/1 var(--fd);padding:14px 30px;border-radius:28px;background:color-mix(in srgb,var(--teal) 14%,var(--surface));color:var(--teal-d);border:3px solid color-mix(in srgb,var(--teal) 40%,var(--surface));box-shadow:0 6px 0 color-mix(in srgb,var(--teal) 40%,var(--surface))}
html[data-theme=dark] .sight-word{color:#5FE0D0}
.sight-word:active{transform:translateY(4px)}
.sentence{font:600 26px/1.6 var(--fd);text-align:center}
.tw{padding:0 3px;border-radius:9px;transition:background .2s}
.tw.hl{background:color-mix(in srgb,var(--teal) 22%,transparent);text-decoration:underline 3px var(--teal);text-underline-offset:6px}
.tw.on,.pw.on{background:var(--sun);color:#3A2600}
.ptitle{font:600 22px var(--fd);text-align:center;margin:4px 0 14px}
.ptext{font:600 27px/1.75 var(--fd);padding:18px;border-radius:28px;background:var(--surface);border:2px solid var(--line)}
.pw{padding:1px 4px;border-radius:10px;transition:background .15s,color .15s}
.pw.rd{color:var(--lav-d)}
html[data-theme=dark] .pw.rd{color:#B6ACFF}
.pfoot{justify-content:space-between}
.play-btn{width:78px;height:78px;border-radius:50%;background:var(--lav);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--lav-d);flex:none;transition:transform .1s,box-shadow .1s}
.play-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lav-d)}
.pfoot .chip{width:118px;justify-content:center}
.overlay-card{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 108px);padding:18px;border-radius:26px;background:var(--surface);box-shadow:0 18px 40px rgba(40,25,10,.22);border:2px solid var(--line);animation:inUp .35s cubic-bezier(.2,.8,.2,1);z-index:20}
.overlay-card .oh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.overlay-card p{font:600 19px/1.35 var(--fd);margin-bottom:14px}
.sbook{flex:1;min-height:0;padding:4px 16px 0;display:flex;flex-direction:column;touch-action:pan-y}
.spage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none}
.spage::-webkit-scrollbar{display:none}
.spage.flip{animation:inF .35s cubic-bezier(.2,.8,.2,1)}
.spage.flipb{animation:inB .35s cubic-bezier(.2,.8,.2,1)}
.sart{border-radius:28px;overflow:hidden;border:3px solid var(--surface);box-shadow:var(--shadow);flex:none;line-height:0;position:relative}
.sart svg{width:100%;height:auto}
.pnum{position:absolute;right:12px;top:12px;font:600 13px var(--fd);background:rgba(255,255,255,.9);color:#26293F;padding:4px 10px;border-radius:10px;line-height:1.4}
.stext{font:600 29px/1.5 var(--fd);text-align:center;padding:4px 6px}
.coach{display:flex;gap:11px;padding:13px 15px;border-radius:20px;background:color-mix(in srgb,var(--sky) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--sky) 30%,var(--surface));font-size:14px;font-weight:600;line-height:1.45}
.coach .ai{width:32px;height:32px;border-radius:11px;background:var(--sky);color:#fff;display:grid;place-items:center;flex:none}
.coach b{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--sky-d)}
.nav-btn{width:58px;height:58px;border-radius:20px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;box-shadow:0 4px 0 var(--shade);flex:none}
.nav-btn:disabled{opacity:.35}
.nav-btn.fin{background:var(--green);color:#fff;border-color:var(--green);--shade:var(--green-d);box-shadow:0 4px 0 var(--green-d)}
.sfoot .btn{height:58px}
.qhead{display:flex;flex-direction:column;align-items:center;gap:12px;margin:8px 0 20px}
.snd-bubble{width:118px;height:118px;border-radius:50%;background:var(--coral);color:#fff;font:600 44px var(--fd);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 0 var(--coral-d);position:relative}
.snd-bubble small{font:800 11px var(--fb);opacity:.9;display:flex;gap:4px;align-items:center}
.snd-bubble::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--coral);opacity:.3;animation:pulse 1.8s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.qq{font:600 22px var(--fd);text-align:center}
.qopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qopt{background:var(--surface);border:3px solid var(--line);border-radius:26px;padding:16px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--line);transition:transform .1s,border-color .2s,background .2s}
.qopt:active{transform:translateY(3px)}
.qopt span{font-size:56px;line-height:1.1}
.qopt b{font:600 18px var(--fd)}
.qopt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--surface));box-shadow:0 5px 0 var(--green);animation:bounce .5s}
.qopt.wrong{animation:shake .45s;opacity:.45}
.qmsg{text-align:center;font:600 18px var(--fd);margin-top:20px;min-height:28px}
.qmsg.ok{color:var(--green-d)}
html[data-theme=dark] .qmsg.ok{color:#6BE39A}

/* ---------- complete ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 30px) 24px 0;text-align:center;overflow-y:auto;scrollbar-width:none}
.medal{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:72px;position:relative;animation:pop .7s cubic-bezier(.2,1.4,.4,1);margin-bottom:14px}
.medal::before{content:'';position:absolute;inset:-14px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,194,60,.35) 0 10deg,transparent 10deg 30deg);animation:spin 12s linear infinite;z-index:-1}
.done h1{font:600 32px var(--fd)}
.done p{color:var(--muted);font-weight:700;margin-top:4px}
.stars{display:flex;gap:10px;margin:18px 0}
.stars span{color:var(--gold);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 4px 0 #E39B00)}
.stars span:nth-child(2){animation-delay:.2s;transform:translateY(-8px)}
.stars span:nth-child(3){animation-delay:.4s}
.rewards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.rw{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:13px;background:var(--surface);border:2px solid var(--line);font:600 15px var(--fd)}
.rw.hot{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-color:var(--sun)}
.nextcard{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:24px;background:var(--surface);border:2px solid var(--line);text-align:left;margin-bottom:6px}
.nextcard .tx{flex:1;min-width:0}
.nextcard small{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.nextcard b{display:block;font:600 17px var(--fd)}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(720deg);opacity:.8}}

/* ---------- library ---------- */
.search{display:flex;align-items:center;gap:10px;height:52px;border-radius:18px;background:var(--surface);border:2px solid var(--line);padding:0 16px;margin-bottom:12px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;font-weight:700;min-width:0}
.filters{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.filters .chip{height:32px;font-size:12.5px;border-radius:11px;padding:0 11px}
.count{font-size:13px;font-weight:800;color:var(--muted);margin:14px 2px 10px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.lcard{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:8px 8px 12px;position:relative;transition:transform .15s}
.lcard:active{transform:scale(.97)}
.lcard .thumb{width:100%;height:104px;border-radius:18px;font-size:54px;margin-bottom:9px}
.lcard .cl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:0 4px}
.lcard b{display:block;font:600 15.5px/1.2 var(--fd);padding:2px 4px 3px}
.lcard small{font-size:12px;color:var(--muted);font-weight:700;padding:0 4px}
.lcard .ok{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-weight:700}
.empty div{font-size:54px;margin-bottom:8px}

/* ---------- progress ---------- */
.streak-card{border-radius:28px;padding:20px;background:linear-gradient(135deg,#FFB020,#FF7A59);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 #E0623F}
.streak-card .big{display:flex;align-items:center;gap:12px}
.streak-card .big b{font:600 50px/1 var(--fd)}
.streak-card .big span{font:600 18px/1.15 var(--fd)}
.streak-card .flame{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;animation:floaty 2.5s ease-in-out infinite}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.wk7 div{text-align:center;font-size:11.5px;font-weight:800;opacity:.95}
.wk7 i{display:grid;place-items:center;width:34px;height:34px;margin:4px auto 0;border-radius:12px;background:rgba(255,255,255,.22);font-style:normal}
.wk7 i.d{background:#fff;color:#FF7A59}
.wk7 i.t{border:2px dashed #fff;background:transparent}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat3 div{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px}
.stat3 b{display:block;font:600 22px var(--fd)}
.stat3 small{font-size:11.5px;font-weight:800;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;position:relative;padding-top:10px}
.chart .gl{position:absolute;left:0;right:0;border-top:2px dashed color-mix(in srgb,var(--coral) 50%,transparent)}
.chart .gl span{position:absolute;right:0;top:-20px;font-size:11px;font-weight:800;color:var(--coral)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:30px;border-radius:9px;background:var(--lav);transition:height .6s cubic-bezier(.2,.8,.2,1);min-height:4px}
.chart .bar.t{background:var(--coral)}
.chart .col small{font-size:11px;font-weight:800;color:var(--muted)}
.catrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.catrow .ci{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.catrow .tx{flex:1}
.catrow .top{display:flex;justify-content:space-between;font-weight:800;font-size:14.5px;margin-bottom:6px}
.catrow .top span{color:var(--muted);font-size:12.5px}
.pbar2{height:11px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.pbar2 i{display:block;height:100%;border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:22px;background:var(--surface);border:2px solid var(--line);text-align:center}
.badge .bi{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;position:relative;background:color-mix(in srgb,var(--sun) 24%,var(--surface));box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 40%,var(--surface))}
.badge b{font:600 13px/1.15 var(--fd)}
.badge.lock .bi{filter:grayscale(1);opacity:.4;box-shadow:none;background:var(--surface-2)}
.badge.lock b{color:var(--muted)}
.badge .lk{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--muted);color:#fff;display:grid;place-items:center;filter:none;opacity:1}

/* ---------- grown-ups ---------- */
.mgroup{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:2px 14px;margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:2px solid var(--line);width:100%;cursor:pointer}
.mrow:last-child{border:0}
.mrow .ic{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.mrow .lbl{flex:1;font-weight:800;font-size:15px}
.mrow .lbl small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.mrow .val{font-size:13.5px;color:var(--muted);font-weight:800}
.mrow.danger{color:var(--red)}
.ver{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin:16px 0 4px}
.prof{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:var(--surface);border:2px solid var(--line)}
.prof b{display:block;font:600 19px var(--fd)}
.prof small{color:var(--muted);font-weight:700;font-size:13px}
.prof .pa{width:56px;height:56px;border-radius:50%;background:var(--lav);color:#fff;display:grid;place-items:center;font:600 22px var(--fd);flex:none}

/* ---------- overlays ---------- */
#toast{position:absolute;left:50%;bottom:calc(var(--sab) + 100px);transform:translate(-50%,16px);background:var(--ink);color:var(--on-ink);padding:12px 16px;border-radius:16px;opacity:0;transition:opacity .25s,transform .3s;z-index:95;font-weight:800;font-size:14px;max-width:86%;width:max-content;display:flex;gap:9px;align-items:center;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{color:var(--green);flex:none}
#sheetLayer{position:absolute;inset:0;z-index:80;pointer-events:none}
#sheetLayer.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(30,20,10,.42);opacity:0;transition:opacity .3s}
#sheetLayer.open .backdrop{opacity:1}
.msheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:32px 32px 0 0;padding:10px 20px calc(var(--sab) + 16px);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);max-height:90%;overflow-y:auto;scrollbar-width:none}
#sheetLayer.open .msheet{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 14px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sh-head>div{flex:1}
.sh-head h3{font:600 23px var(--fd)}
.sh-head p{font-size:14.5px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.4}
.opt{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;border:2px solid var(--line);margin-bottom:8px;width:100%;font-weight:800;font-size:15.5px;transition:border-color .2s}
.opt.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 7%,var(--surface))}
.opt .tx{flex:1;min-width:0}
.opt small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.radio{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--surface-3);flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--coral);background:var(--coral);color:#fff}
.tips-list li{list-style:none;display:flex;gap:10px;font-size:15px;font-weight:700;line-height:1.45;margin-bottom:10px}
.tips-list li svg{color:var(--green);margin-top:2px}
.gate-q{font:600 44px var(--fd);text-align:center;margin:6px 0 18px}
.gate-a{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gate-a button{height:64px;border-radius:20px;background:var(--surface-2);font:600 26px var(--fd);text-align:center;box-shadow:0 4px 0 var(--shade)}
.gate-a button.no{animation:shake .4s;background:color-mix(in srgb,var(--red) 18%,var(--surface))}
.bigbadge{text-align:center;padding:4px 0 6px}
.bigbadge .bi{width:120px;height:120px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;font-size:62px;background:color-mix(in srgb,var(--sun) 28%,var(--surface));box-shadow:0 0 0 8px color-mix(in srgb,var(--sun) 40%,var(--surface));animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.bigbadge small{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--coral)}
.bigbadge h3{font:600 28px var(--fd);margin:4px 0 6px}
.bigbadge p{color:var(--muted);font-weight:700;margin-bottom:18px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.times button{height:48px;border-radius:15px;background:var(--surface-2);font-weight:800;font-size:14px;text-align:center}
.times button.on{background:var(--ink);color:var(--on-ink)}

/* ---------- data viewer ---------- */

  const L = $('#confetti'); const cols = ['#FF7A59', '#FFB020', '#22B5A4', '#8B7CF6', '#4DA3FF', '#FF5C7A', '#36B868'];
  let h = '';
  for (let i = 0; i < n; i++) h += `<i style="left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .5}s;transform:rotate(${Math.random() * 360}deg);width:${6 + Math.random() * 7}px"></i>`;
  L.innerHTML = h; setTimeout(() => { L.innerHTML = ''; }, 3800);
}
const toggleHTML = (key, on) => `<button class="switch ${on ? 'on' : ''}" data-key="${key}" aria-label="Toggle"></button>`;
function bindToggles(root) {
  root.addEventListener('click', e => {
    const s = e.target.closest('.switch[data-key]'); if (!s) return;
    e.stopPropagation(); const k = s.dataset.key;
    S.settings[k] = !S.settings[k]; s.classList.toggle('on', S.settings[k]);
    if (k === 'bedtime') setTheme(S.settings.bedtime ? 'dark' : 'light');
    if (k === 'offline' && S.settings.offline) toast('Downloading today’s lessons for offline use');
    if (k === 'sfx' && S.settings.sfx) sfx('ding');
  });
}

/* ---------- shared bits ---------- */
function tabbar(active) {
  const t = [['home', 'sun', 'Today'], ['library', 'book', 'Library'], ['progress', 'chart', 'Progress'], ['grownups', 'users', 'Grown-ups']];
  return `<nav class="tabbar">${t.map(([id, i, l]) => `<button class="${id === active ? 'on' : ''}" onclick="tab('${id}')"><span class="ti">${ic(i, 21)}</span>${l}</button>`).join('')}</nav>`;
}
function thumb(a, w = 58, h = w, fs) {
  const C = CATS[a.cat];
  const inner = a.type === 'story' ? scene(a.pages[0].scene) : `<span style="font-size:${fs || Math.round(Math.min(w, h) * .52)}px;line-height:1">${a.emoji}</span>`;
  return `<span class="thumb" style="width:${w}px;height:${h}px;background:${tint(C.c, 20)}">${inner}</span>`;
}
function ring(val, max, size = 76, sw = 9, col = '#FF7A59') {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, p = clamp(val / max, 0, 1);
  return `<svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--surface-2)" stroke-width="${sw}" fill="none"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${col}" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" style="transition:stroke-dashoffset .8s"/></svg>`;
}
function weekLabels() { const d = new Date(), out = []; for (let i = 6; i >= 0; i--) { const x = new Date(d); x.setDate(d.getDate() - i); out.push(x.toLocaleDateString('en-US', { weekday: 'narrow' })); } return out; }
function askCard(text) { return `<div class="ask"><span class="ai">${ic('users', 19)}</span><div><small>For grown-ups</small><p>${text}</p></div></div>`; }
function openChildSwitch() {
  openSheet(`${sheetHead('Who’s learning today?', 'Each child gets their own plan and progress.')}<div id="kl">${S.children.map(c => `<button class="opt ${c.id === S.cur ? 'on' : ''}" data-id="${c.id}">${animal(c.avatar, 46)}<span class="tx">${esc(c.name)}<small>Age ${c.age} · Level ${c.level} · 🔥 ${c.streak} days</small></span><span class="radio">${c.id === S.cur ? ic('check', 14, 3.5) : ''}</span></button>`).join('')}</div><button class="btn btn-ghost" id="addKid">${ic('plus', 20)} Add a child</button>`, sh => {
    sh.querySelector('#kl').onclick = e => { const b = e.target.closest('[data-id]'); if (!b) return; S.cur = b.dataset.id; closeSheet(); refresh(); toast(`Switched to ${child().name}`); };
    sh.querySelector('#addKid').onclick = () => { S.draft = { name: '', age: null, avatar: 'bunny', goal: 10, reminder: '7:30 PM', adding: true }; go('setup1'); };
  });
}
function openGate() {
  const a = 2 + Math.floor(Math.random() * 6), b = 2 + Math.floor(Math.random() * 6), ans = a + b;
  const opts = [ans, ans + 1, ans - 2, ans + 3].sort(() => Math.random() - .5);
  openSheet(`${sheetHead('Grown-ups only', 'Settings are behind a parent gate so little hands stay in the fun parts.')}<div class="gate-q">${a} + ${b} = ?</div><div class="gate-a" id="ga">${opts.map(n => `<button data-n="${n}">${n}</button>`).join('')}</div>`, sh => {
    sh.querySelector('#ga').onclick = e => {
      const btn = e.target.closest('[data-n]'); if (!btn) return;
      if (+btn.dataset.n === ans) { S.gateOk = true; sfx('ding'); go('grownups', { reset: true, dir: 'fade' }); }
      else { btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no'); sfx('oops'); }
    };
  });
}
function openTips(a, extra) {
  openSheet(`${sheetHead('Coaching tips', `For ${esc(a.title)}`)}<ul class="tips-list">${a.tips.map(t => `<li>${ic('check', 18, 3)}<span>${t}</span></li>`).join('')}${extra ? `<li>${ic('check', 18, 3)}<span>${extra}</span></li>` : ''}</ul><button class="btn btn-dark" onclick="closeSheet()">Got it</button>`);
}
function leaveLesson() {
  openSheet(`${sheetHead('Take a break?', 'You can pick up this activity any time from Today.')}<div style="display:grid;gap:10px"><button class="btn btn-primary" onclick="closeSheet()">Keep going</button><button class="btn btn-ghost" onclick="go('home',{reset:true})">Leave activity</button></div>`);
}
function setTheme(t) { document.documentElement.dataset.theme = t; S.settings.bedtime = t === 'dark'; const b = $('#themeBtn'); if (b) b.innerHTML = `${ic(t === 'dark' ? 'sun' : 'moon', 17)} ${t === 'dark' ? 'Day mode' : 'Bedtime mode'}`; }

/* ---------- completion & progress ---------- */
function finishActivity(a) {
  AUD.stop();
  const c = child(), before = new Set(c.badges);
  const res = { a, stars: 3, streakUp: false, newBadges: [] };
  if (!c.done.includes(a.id)) c.done.push(a.id);
  c.mins[6] += a.minutes; c.stars += 3; c.activities++;
  c.cat[a.cat] = Math.min(1, (c.cat[a.cat] || 0) + .06);
  if (a.type === 'story') c.stories++;
  if (!c.todayStarted) { c.todayStarted = true; c.streak++; res.streakUp = true; }
  BADGES.forEach(b => { if (!before.has(b.id) && b.test(c)) { c.badges.push(b.id); res.newBadges.push(b); } });
  S.result = res;
  go('complete', { reset: true, dir: 'up' });
}
function setBar(p) { const b = $('#lbar'); if (b) b.style.width = (clamp(p, 0, 1) * 100).toFixed(1) + '%'; }
function lessonHead() { return `<div class="lhead"><button class="ibtn" onclick="leaveLesson()" aria-label="Close">${ic('x', 20)}</button><div class="lbar"><i id="lbar"></i></div><button class="ibtn" id="tipBtn" aria-label="Coaching tips">${ic('bulb', 20)}</button></div>`; }
function showBadge(b) {
  confetti(50); sfx('win');
  openSheet(`<div class="bigbadge"><div class="bi">${b.emoji}</div><small>New badge unlocked!</small><h3>${b.name}</h3><p>${b.desc}</p><button class="btn btn-primary" onclick="closeSheet()">Yay!</button></div>`);
}

/* ---------- lesson renderers (one per content type) ---------- */
const RENDER = {
  sounds: {
    html: a => `<div class="lbody"><div class="ltitle">${esc(a.title)}</div><div id="sb"></div></div><div class="lfoot"><div class="ldots" id="sd"></div><button class="btn btn-primary" id="sNext" disabled>Next</button></div>`,
    mount(el, a) {
      let i = 0; const items = a.items, C = CATS[a.cat], c = child();
      const sb = el.querySelector('#sb'), nx = el.querySelector('#sNext');
      const ready = () => { if (nx.disabled) { nx.disabled = false; sfx('ding'); } };
      const wave = '<span class="wave"><i></i><i></i><i></i><i></i></span>';
      const draw = () => {
        const it = items[i]; nx.disabled = true; nx.textContent = i === items.length - 1 ? 'Finish' : 'Next';
        setBar(i / items.length);
        el.querySelector('#sd').innerHTML = items.map((_, k) => `<i class="${k < i ? 'd' : k === i ? 'on' : ''}"></i>`).join('');
        if (a.mode === 'sight') {
          sb.innerHTML = `<div class="wcard"><button class="sight-word" id="sw">${it.word}</button><div class="cap" id="cap">Tap the word to hear it</div><div class="sentence" id="sen">${tokens(it.sentence).map(t => `<button class="tw ${t.clean.toLowerCase() === it.word ? 'hl' : ''}" data-w="${t.clean}">${esc(t.raw)}</button>`).join(' ')}</div></div>${askCard(`Ask: “Can you find <b>${it.word}</b> in the sentence?” Then read it together.`)}`;
          const cap = sb.querySelector('#cap');
          sb.querySelector('#sw').onclick = e => { e.currentTarget.style.animation = 'none'; void e.currentTarget.offsetWidth; e.currentTarget.style.animation = 'bounce .45s'; cap.innerHTML = `<b>${it.word}</b>${wave}`; AUD.say(it.word, { onend: () => { cap.innerHTML = `<b>${it.word}</b>`; } }); c.soundTaps++; ready(); };
          sb.querySelector('#sen').onclick = e => {
            const w = e.target.closest('[data-w]'); if (!w) return;
            $$('.tw', sb).forEach(x => x.classList.remove('on')); w.classList.add('on');
            AUD.say(w.dataset.w, { onend: () => w.classList.remove('on') });
            if (w.dataset.w.toLowerCase() === it.word) { cap.innerHTML = `You found <b>${it.word}</b>! 🎉`; ready(); }
          };
        } else {
          sb.innerHTML = `<div class="wcard"><div class="pic" id="pic" style="background:${tint(C.c, 18)}">${it.pic}</div><div class="tiles" id="tiles">${it.sounds.map((g, k) => `<button class="tile ${VOW.has(g) ? 'v' : ''}" data-k="${k}">${g}</button>`).join('')}</div><div class="cap" id="cap">Tap each sound</div><button class="btn btn-ghost blend" id="blend">${ic('play', 20)} Blend it</button></div>${askCard(it.ask || `Ask: “What sound does <b>${it.word}</b> start with?” Then find something else that starts the same way.`)}`;
          const tiles = sb.querySelector('#tiles'), cap = sb.querySelector('#cap');
          const flash = k => { const t = tiles.children[k]; if (!t) return; t.classList.remove('pl'); void t.offsetWidth; t.classList.add('pl'); };
          tiles.onclick = e => {
            const t = e.target.closest('[data-k]'); if (!t) return; const k = +t.dataset.k, g = it.sounds[k];
            flash(k); sfx('tap'); c.soundTaps++; cap.innerHTML = `<b>/${g}/</b>${wave}`;
            AUD.say(PH[g] || g, { rate: .9, onend: () => { cap.innerHTML = `<b>/${g}/</b>`; } });
          };
          sb.querySelector('#pic').onclick = () => { AUD.say(it.word); cap.innerHTML = `<b>${it.word}</b>${wave}`; };
          sb.querySelector('#blend').onclick = () => {
            tiles.classList.remove('merged');
            const list = [...it.sounds.map(g => PH[g] || g), it.word];
            sayChain(list, k => { if (k < it.sounds.length) { flash(k); cap.innerHTML = `<b>/${it.sounds[k]}/</b>${wave}`; } else { tiles.classList.add('merged'); cap.innerHTML = `<b style="font-size:30px">${it.word}</b>${wave}`; } },
              () => { cap.innerHTML = `<b style="font-size:30px">${it.word}</b> 🎉`; ready(); }, 60);
          };
        }
      };
      nx.onclick = () => { if (i < items.length - 1) { i++; draw(); } else finishActivity(a); };
      draw();
    }
  },

  passage: {
    html: a => `<div class="lbody"><div class="ptitle">${a.emoji} ${esc(a.title)}</div><div class="ptext" id="pt"></div><div class="cap" id="phint" style="margin-top:16px;font-size:16px">Tap play to read along, or tap any word.</div></div><div class="lfoot pfoot" id="pf"><button class="chip" id="spd"></button><button class="play-btn" id="pp" aria-label="Play">${ic('play', 34)}</button><button class="chip" id="echo"></button></div>`,
    mount(el, a) {
      const W = []; a.sentences.forEach((s, si) => tokens(s).forEach(t => W.push({ ...t, s: si })));
      const pt = el.querySelector('#pt'), pp = el.querySelector('#pp'), pf = el.querySelector('#pf'), hint = el.querySelector('#phint');
      pt.innerHTML = W.map((w, i) => `<button class="pw" data-i="${i}">${esc(w.raw)}</button>`).join(' ');
      const btns = $$('.pw', pt); let idx = 0, playing = false, echo = false; const shown = new Set();
      const spd = el.querySelector('#spd'), eb = el.querySelector('#echo');
      const drawCtl = () => { spd.innerHTML = S.settings.speed === 'slow' ? `${ic('turtle', 17)} Slow` : `${ic('rabbit', 17)} Normal`; eb.innerHTML = `${ic('repeat', 16)} Echo`; eb.classList.toggle('on', echo); pp.innerHTML = playing ? ic('pause', 34) : ic('play', 34); };
      const mark = i => { btns.forEach((b, k) => { b.classList.toggle('on', k === i); b.classList.toggle('rd', k < i); }); setBar(i / W.length); };
      const removeCard = () => { const o = el.querySelector('.overlay-card'); if (o) o.remove(); };
      const card = (kind, text, btn, fn) => {
        removeCard(); const d = document.createElement('div'); d.className = 'overlay-card';
        const col = kind === 'echo' ? 'var(--teal)' : 'var(--lav)';
        d.innerHTML = `<div class="oh" style="color:${col}">${ic(kind === 'echo' ? 'mic' : 'users', 16)} ${kind === 'echo' ? 'Your turn' : 'Pause & ask'}</div><p>${text}</p><button class="btn ${kind === 'echo' ? 'btn-green' : 'btn-primary'} sm">${btn}</button>`;
        d.querySelector('button').onclick = () => { removeCard(); sfx('tap'); fn(); };
        el.appendChild(d);
      };
      const end = () => { playing = false; mark(W.length); btns.forEach(b => b.classList.add('rd')); hint.textContent = 'Great reading! 🎉'; sfx('win'); pf.innerHTML = `<button class="btn btn-ghost" id="again">${ic('repeat', 18)} Again</button><button class="btn btn-green" id="fin">Finish</button>`; pf.querySelector('#again').onclick = () => { refresh(); }; pf.querySelector('#fin').onclick = () => finishActivity(a); };
      const pause = () => { playing = false; AUD.stop(); drawCtl(); };
      const playFrom = i => {
        removeCard(); playing = true; drawCtl(); hint.textContent = 'Follow the yellow word with your finger';
        if (i >= W.length) { end(); return; }
        idx = i; mark(i);
        AUD.say(W[i].clean, { onend: () => {
          if (!playing) return;
          const last = i === W.length - 1, endSent = last || W[i + 1].s !== W[i].s, s = W[i].s; idx = i + 1;
          if (endSent) {
            if (a.prompts && a.prompts[s] && !shown.has(s)) { shown.add(s); playing = false; drawCtl(); mark(idx); card('ask', a.prompts[s], 'Keep reading', () => playFrom(idx)); return; }
            if (echo && !last) { playing = false; drawCtl(); mark(idx); card('echo', `Read it back together: “${a.sentences[s]}”`, 'We read it! ✓', () => playFrom(idx)); return; }
            later(() => { if (playing) playFrom(idx); }, 380);
          } else playFrom(idx);
        } });
      };
      pp.onclick = () => playing ? pause() : playFrom(idx >= W.length ? 0 : idx);
      spd.onclick = () => { S.settings.speed = S.settings.speed === 'slow' ? 'normal' : 'slow'; drawCtl(); toast(S.settings.speed === 'slow' ? 'Slow reading on' : 'Normal speed'); };
      eb.onclick = () => { echo = !echo; drawCtl(); toast(echo ? 'Echo reading: pauses after each sentence' : 'Echo reading off'); };
      pt.onclick = e => { const b = e.target.closest('[data-i]'); if (!b || playing) return; b.classList.add('on'); AUD.say(W[+b.dataset.i].clean, { onend: () => b.classList.remove('on') }); sfx('tap'); };
      drawCtl(); setBar(0);
    }
  },

  story: {
    html: a => `<div class="sbook" id="sbk"><div class="spage" id="spg"></div></div><div class="lfoot sfoot"><button class="nav-btn" id="prev" aria-label="Previous page">${ic('chevL', 26, 2.6)}</button><button class="btn btn-ghost" id="rtm">${ic('vol', 20)} Read to me</button><button class="nav-btn" id="next" aria-label="Next page">${ic('chevR', 26, 2.6)}</button></div>`,
    mount(el, a) {
      let p = 0; const n = a.pages.length, spg = el.querySelector('#spg'), prev = el.querySelector('#prev'), next = el.querySelector('#next'), rtm = el.querySelector('#rtm');
      let reading = false;
      const draw = dir => {
        AUD.stop(); reading = false; rtm.innerHTML = `${ic('vol', 20)} Read to me`;
        const pg = a.pages[p];
        spg.className = 'spage' + (dir ? (dir > 0 ? ' flip' : ' flipb') : '');
        spg.innerHTML = `<div class="sart">${scene(pg.scene)}<span class="pnum">${p + 1} / ${n}</span></div><div class="stext" id="stx">${tokens(pg.text).map((t, k) => `<button class="tw" data-k="${k}">${esc(t.raw)}</button>`).join(' ')}</div>${S.settings.tips ? `<div class="coach"><span class="ai">${ic('bulb', 17)}</span><div><b>Coach</b>${pg.tip}</div></div>` : ''}`;
        prev.disabled = p === 0;
        next.classList.toggle('fin', p === n - 1); next.innerHTML = p === n - 1 ? ic('check', 26, 3) : ic('chevR', 26, 2.6);
        setBar(p / n);
        spg.querySelector('#stx').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; const w = tokens(pg.text)[+b.dataset.k].clean; $$('.tw', spg).forEach(x => x.classList.remove('on')); b.classList.add('on'); AUD.say(w, { onend: () => b.classList.remove('on') }); };
      };
      const turn = d => { const np = p + d; if (np < 0) return; if (np >= n) { finishActivity(a); return; } p = np; sfx('page'); draw(d); };
      prev.onclick = () => turn(-1); next.onclick = () => turn(1);
      rtm.onclick = () => {
        if (reading) { AUD.stop(); reading = false; rtm.innerHTML = `${ic('vol', 20)} Read to me`; $$('.tw', spg).forEach(x => x.classList.remove('on')); return; }
        reading = true; rtm.innerHTML = `${ic('pause', 20)} Stop`;
        const tk = tokens(a.pages[p].text), bs = $$('#stx .tw', spg);
        sayChain(tk.map(t => t.clean), k => bs.forEach((b, j) => b.classList.toggle('on', j === k)), () => { bs.forEach(b => b.classList.remove('on')); reading = false; rtm.innerHTML = `${ic('repeat', 20)} Read again`; }, 140);
      };
      let sx = null; const bk = el.querySelector('#sbk');
      bk.addEventListener('pointerdown', e => { sx = e.clientX; });
      bk.addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) turn(dx < 0 ? 1 : -1); });
      draw(0);
    }
  },

  quiz: {
    html: a => `<div class="lbody"><div class="qhead"><button class="snd-bubble" id="qs"></button><div class="qq" id="qq"></div></div><div class="qopts" id="qo"></div><div class="qmsg" id="qm"></div></div><div class="lfoot"><div class="ldots" id="qd"></div><button class="btn btn-primary" id="qn" disabled>Next</button></div>`,
    mount(el, a) {
      let r = 0, solved = false; const R = a.rounds;
      const qs = el.querySelector('#qs'), qo = el.querySelector('#qo'), qm = el.querySelector('#qm'), qn = el.querySelector('#qn');
      const ask = () => AUD.say(`Which one starts with ${PH[R[r].sound]}?`);
      const draw = () => {
        solved = false; const rd = R[r]; qn.disabled = true; qn.textContent = r === R.length - 1 ? 'Finish' : 'Next';
        setBar(r / R.length);
        el.querySelector('#qd').innerHTML = R.map((_, k) => `<i class="${k < r ? 'd' : k === r ? 'on' : ''}"></i>`).join('');
        qs.innerHTML = `/${rd.sound}/<small>${ic('vol', 13)} tap to hear</small>`;
        el.querySelector('#qq').innerHTML = `Which one starts with /${rd.sound}/?`;
        qo.innerHTML = rd.options.map(o => `<button class="qopt" data-w="${o.word}"><span>${o.pic}</span><b>${o.word}</b></button>`).join('');
        qm.className = 'qmsg'; qm.textContent = '';
        later(ask, 500);
      };
      qs.onclick = () => { sfx('tap'); AUD.say(PH[R[r].sound]); };
      qo.onclick = e => {
        const b = e.target.closest('[data-w]'); if (!b || solved || b.classList.contains('wrong')) return;
        const w = b.dataset.w, rd = R[r];
        if (w === rd.answer) {
          solved = true; b.classList.add('right'); sfx('ding'); child().soundTaps++;
          qm.className = 'qmsg ok'; qm.innerHTML = `Yes! <b>${w}</b> starts with /${rd.sound}/ 🎉`;
          AUD.say(`Yes! ${w} starts with ${PH[rd.sound]}`); qn.disabled = false;
        } else {
          b.classList.add('wrong'); sfx('oops'); qm.className = 'qmsg'; qm.innerHTML = `<b>${w}</b> starts with a different sound. Listen again: /${rd.sound}/`;
          AUD.say(`${w}. Listen again. ${PH[rd.sound]}`);
        }
      };
      qn.onclick = () => { if (r < R.length - 1) { r++; draw(); } else finishActivity(a); };
      draw();
    }
  }
};

  home: {

      const c = child(), plan = planFor(c), doneN = plan.filter(id => c.done.includes(id)).length, next = plan.map(ACT).find(a => !c.done.includes(a.id));

        : `<div class="hero done-hero"><div class="hl">Today’s plan</div><h3>All done! 🎉</h3><div class="hm">Come back tomorrow to keep the streak going.</div><button class="btn" onclick="tab('library')">${ic('book', 18)} Explore more</button><div class="hart">🏆</div></div>`;
      return `<div class="hhead"><button class="kid" onclick="openChildSwitch()">${animal(c.avatar, 50)}<span><small>${greeting()}${S.parent ? ', ' + esc(S.parent) : ''}</small><b>Today with ${esc(c.name)} ${ic('chevD', 18, 2.6)}</b></span></button><div class="streak-pill" title="Day streak">${icf('flame', 20)} ${c.streak}</div></div>
      <div class="scroll">

        ${hero}
        <div class="sec">Today’s plan <small>~${plan.reduce((s, id) => s + ACT(id).minutes, 0)} min</small></div>
        <div class="plan">${plan.map(ACT).map((a, k) => { const C = CATS[a.cat], dn = c.done.includes(a.id); return `<button class="prow ${dn ? 'done' : ''}" data-open="${a.id}">${thumb(a, 58)}<span class="tx"><span class="cl" style="color:${C.d}">${C.name}</span><b>${esc(a.title)}</b><small>${a.minutes} min · ${TYPES[a.type]}</small></span><span class="st">${dn ? ic('check', 18, 3.2) : k + 1}</span></button>`; }).join('')}</div>
        <div class="sec">Tip for grown-ups</div>

        <div class="sec">More to explore <small onclick="tab('library')" style="cursor:pointer">See all</small></div>
        <div class="hscroll">${explore.map(a => `<button class="mini" data-open="${a.id}">${thumb(a, 150, 110, 54)}<b>${esc(a.title)}</b><small>${a.minutes} min · ${CATS[a.cat].name}</small></button>`).join('')}</div>
      </div>${tabbar('home')}`;

    mount(el) { el.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) { S.act = b.dataset.open; go('intro'); } }); }
  },

  library: {
    html: () => `<div class="tb-big"><h1>Library</h1><span class="muted" style="font-weight:800;font-size:13px">${CONTENT.length} activities</span></div>
      <div class="scroll">

        <div class="filters" id="lf">${[['len', 'all', 'Any length'], ['len', 'short', '≤ 3 min'], ['len', 'long', '4–5 min']].map(([g, v, l]) => `<button class="chip ${S.lib[g] === v ? 'on' : ''}" data-g="${g}" data-v="${v}">${l}</button>`).join('')}<span style="width:6px"></span>${[['lvl', 'all', 'All levels'], ['lvl', '1', 'Level 1'], ['lvl', '2', 'Level 2']].map(([g, v, l]) => `<button class="chip ${S.lib[g] === v ? 'on' : ''}" data-g="${g}" data-v="${v}">${l}</button>`).join('')}</div>

          : `<div class="empty"><div>🔎</div>Nothing matches yet.<br><button class="btn-link" id="clr" style="color:var(--coral)">Clear filters</button></div>`;

      el.querySelector('#kids').onclick = e => { const b = e.target.closest('[data-id]'); if (!b) return; S.cur = b.dataset.id; refresh(); toast(`${child().name} is now active`); };
      el.querySelector('#addK').onclick = () => { S.draft = { name: '', age: null, avatar: 'bunny', goal: 10, reminder: S.settings.reminder, adding: true }; go('setup1'); };
      el.querySelector('#goalR').onclick = () => openSheet(`${sheetHead('Daily goal', `How many minutes for ${esc(child().name)}?`)}<div id="gs">${[5, 10, 15, 20].map(m => `<button class="opt ${child().goal === m ? 'on' : ''}" data-m="${m}"><span class="tx">${m} minutes<small>${{ 5: 'Quick & easy', 10: 'Recommended', 15: 'Keen reader', 20: 'Super reader' }[m]}</small></span><span class="radio">${child().goal === m ? ic('check', 14, 3.5) : ''}</span></button>`).join('')}</div>`, sh => { sh.querySelector('#gs').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; child().goal = +b.dataset.m; closeSheet(); refresh(); toast('Daily goal updated'); }; });
      el.querySelector('#remR').onclick = () => openSheet(`${sheetHead('Daily reminder', 'A gentle nudge at the same time each day builds the habit.')}<div class="times" id="rt">${['7:00 AM', '7:30 AM', '12:00 PM', '4:00 PM', '6:30 PM', '7:30 PM'].map(t => `<button class="${S.settings.reminder === t ? 'on' : ''}" data-t="${t}">${t}</button>`).join('')}</div><div class="opt" style="cursor:default"><span class="tx">Reminders on</span>${toggleHTML('remind', S.settings.remind)}</div><button class="btn btn-dark" id="rtd" style="margin-top:6px">Save</button>`, sh => { bindToggles(sh); sh.querySelector('#rt').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; S.settings.reminder = b.dataset.t; $$('#rt button', sh).forEach(x => x.classList.toggle('on', x === b)); }; sh.querySelector('#rtd').onclick = () => { closeSheet(); refresh(); toast(S.settings.remind ? 'Reminder set for ' + S.settings.reminder : 'Reminders off'); }; });
      el.querySelector('#helpR').onclick = () => openSheet(`${sheetHead('Help & support', 'Questions about lessons, progress or your subscription? Our team replies within one day.')}<button class="btn btn-primary" id="hsend">Contact support</button>`, sh => { sh.querySelector('#hsend').onclick = () => { closeSheet(); toast('Message sent — we’ll reply by email'); }; });
      el.querySelector('#privR').onclick =() => openSheet(`${sheetHead('Privacy & data')}<ul class="tips-list"><li>${ic('check', 18, 3)}<span>No ads, ever. Children never see links that leave the app.</span></li><li>${ic('check', 18, 3)}<span>Settings live behind a parent gate.</span></li><li>${ic('check', 18, 3)}<span>Progress syncs securely to your family account.</span></li></ul><button class="btn btn-dark" onclick="closeSheet()">Got it</button>`);
      el.querySelector('#outR').onclick = () => openSheet(`${sheetHead('Sign out?', 'Progress is saved to your account.')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn btn-ghost" onclick="closeSheet()">Stay</button><button class="btn btn-primary" onclick="S.gateOk=false;go('welcome',{reset:true})">Sign out</button></div>`);
    }
  }
};

/* ---------- pitch panel, data viewer, frame ---------- */
const JUMPS = [['welcome', 'Welcome'], ['setup1', 'Child setup'], ['home', 'Today'], ['intro', 'Lesson intro'], ['sounds', 'Tap & hear'], ['passage', 'Read along'], ['story', 'Storybook'], ['quiz', 'Sound hunt'], ['complete', 'Celebration'], ['progress', 'Progress'], ['library', 'Library'], ['grownups', 'Grown-ups']];
function jump(n) {
  closeSheet(true);
  const c = child(), plan = planFor(c);
  const pick = t => plan.map(ACT).find(a => a.type === t) || CONTENT.find(a => a.type === t && a.level === c.level) || CONTENT.find(a => a.type === t);
  switch (n) {
    case 'welcome': go('welcome', { reset: true }); break;
    case 'setup1': S.draft = { name: '', age: null, avatar: 'fox', goal: 10, reminder: '7:30 PM' }; go('setup1', { reset: true, stack: ['welcome'] }); break;
    case 'intro': S.act = plan.map(ACT).find(a => !c.done.includes(a.id))?.id || plan[0]; go('intro', { reset: true, stack: ['home'] }); break;
    case 'sounds': case 'passage': case 'story': case 'quiz': S.act = pick(n === 'sounds' ? 'sounds' : n).id; go('play', { reset: true, stack: ['home', 'intro'] }); break;
    case 'complete': { const a = pick('sounds'); S.act = a.id; finishActivity(a); break; }
    case 'grownups': S.gateOk = true; go('grownups', { reset: true }); break;
    default: go(n, { reset: true });
  }
}
function markJump(name) {
  const m = { splash: 'welcome', setup2: 'setup1', building: 'setup1' };
  let k = m[name] || name;
  if (name === 'play') { const a = ACT(S.act); k = a ? (a.type === 'sounds' ? 'sounds' : a.type) : k; }
  $$('#jump button').forEach(b => b.classList.toggle('on', b.dataset.j === k));
}
function dataFor() {
  const c = child();
  if ((current === 'play' || current === 'intro') && S.act) return { t: 'Activity: ' + ACT(S.act).title, s: `collection: content/${S.act} · rendered by the “${ACT(S.act).type}” renderer`, o: ACT(S.act) };
  if (current === 'library') return { t: 'Content library', s: 'collection: content (filtered client-side by category, length, level)', o: CONTENT.map(a => ({ id: a.id, type: a.type, category: a.cat, level: a.level, minutes: a.minutes, title: a.title })) };
  if (current === 'progress' || current === 'complete') return { t: `Progress: ${c.name}`, s: `document: children/${c.id}/progress`, o: { childId: c.id, streak: c.streak, stars: c.stars, activitiesCompleted: c.activities, minutesLast7Days: c.mins, skillProgress: c.cat, badges: c.badges, completedToday: c.done } };
  return { t: `Today’s plan: ${c.name}`, s: `document: children/${c.id}/plans/today → references content/*`, o: { child: { id: c.id, name: c.name, age: c.age, level: c.level, dailyGoalMinutes: c.goal }, plan: planFor(c).map(id => { const a = ACT(id); return { contentId: id, type: a.type, category: a.cat, minutes: a.minutes, done: c.done.includes(id) }; }) } };
}
function hl(json) { return esc(json).replace(/(&quot;[^&]*?&quot;)(\s*:)?|\b(true|false|null)\b|-?\d+\.?\d*/g, (m, s, colon, b) => s ? `<span class="${colon ? 'k' : 's'}">${s}</span>${colon || ''}` : b ? `<span class="b">${m}</span>` : `<span class="n">${m}</span>`); }
function showData() {
  const d = dataFor();
  $('#dmT').textContent = d.t; $('#dmS').textContent = d.s;
  $('#dmPre').innerHTML = hl(JSON.stringify(d.o, null, 2));
  $('#dmF').textContent = 'Every screen is drawn from structured data like this. Adding lessons means adding records, not code: each content type (sounds, passage, story, quiz) has one renderer.';
  $('#dm').classList.add('open');
}
function buildPitch() {
  $('#pitch').innerHTML = `<div class="brand">${logo(38)}${APP}<em>Concept</em></div>
    <h1>Daily reading practice for parents & kids</h1>
    <p>A clickable prototype of the learning app: a personalized daily plan, tap-to-hear sounds, read-along passages, an illustrated storybook, progress tracking and a filterable library. Turn your sound on.</p>
    <ul class="feats">
      <li><span style="background:#FF7A59">${ic('ear', 16, 2.4)}</span>Tap highlighted words to hear each sound</li>
      <li><span style="background:#8B7CF6">${ic('book', 16, 2.4)}</span>Read-along audio with parent prompts</li>
      <li><span style="background:#4DA3FF">${ic('moon', 16, 2.4)}</span>Storybook with per-page coaching</li>
      <li><span style="background:#FFB020">${ic('flame', 16, 2.4)}</span>Streaks, skill progress & badges</li>
      <li><span style="background:#22B5A4">${ic('code', 16, 2.4)}</span>Every lesson renders from JSON content</li>
    </ul>
    <div class="jump-title">Jump to a screen</div>
    <div class="jump" id="jump">${JUMPS.map(([k, l]) => `<button data-j="${k}">${l}</button>`).join('')}</div>
    <div class="pitch-foot"><button class="dbtn" id="dataBtn">${ic('code', 17)} View content data</button><button id="themeBtn">${ic('moon', 17)} Bedtime mode</button><button id="restartBtn">${ic('repeat', 17)} Restart</button></div>
    <div class="hint-small">Tip: open this page on a phone for the full-screen app experience.</div>`;
  $('#jump').onclick = e => { const b = e.target.closest('[data-j]'); if (b) jump(b.dataset.j); };
  $('#themeBtn').onclick = () => { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); if (current === 'grownups') refresh(); };
  $('#restartBtn').onclick = () => { S.gateOk = false; go('splash', { reset: true }); };
  $('#dataBtn').onclick = showData;
  $('#dmX').onclick = () => $('#dm').classList.remove('open');
  $('#dm').onclick = e => { if (e.target.id === 'dm') $('#dm').classList.remove('open'); };
}
function fitPhone() { const s = window.innerWidth <= 520 ? 1 : Math.min(1, (window.innerHeight - 40) / 844); document.documentElement.style.setProperty('--s', s.toFixed(4)); }
function tick() { $('#sbTime').textContent = fmtTime(new Date()).replace(/\s?[AP]M/, ''); }

/* ---------- boot ---------- */
buildPitch(); fitPhone(); tick(); setInterval(tick, 15000);
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(fitPhone, 120); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#dm').classList.remove('open'); });
go('splash');
</script>
</body>
</html>
